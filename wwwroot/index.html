    <script>
        let IsMobile;
        window.onload = function () {
            IsMobile = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini|mobile/i.test(navigator.userAgent);
        };
        function isDevice() {
            return IsMobile;
        }

        function ResetBodyOverflow() {
            // 1. Find the body element
            const body = document.querySelector("body");

            // 2. Remove specific criteria (e.g., overflow and padding-right)
            body.style.removeProperty("overflow");
            body.style.removeProperty("padding-right");
        }

        window.scrollToFragment = (elementId) => {
            const element = document.getElementById(elementId);
            if (element) {
                const yOffset = -150; 
                const y = element.getBoundingClientRect().top + window.scrollY + yOffset;

                window.scrollTo({ top: y, behavior: 'smooth' });
            }
        }
    </script>
